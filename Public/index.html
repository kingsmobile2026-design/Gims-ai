<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://generativelanguage.googleapis.com">
<title>Gims AI</title>
<style>
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{color-scheme:light dark;--bg:#fff;--side:#f7f7f8;--panel:#fff;--text:#1a1a1f;--muted:#6b6f7b;--line:#e4e6eb;--hover:#eeeff2;--user:#f1f2f5;--ink:#1a1a1f;--onink:#fff;--aura:#4f8cff,#8b5cf6,#ec5fa8,#ffb454,#4f8cff;--accent:#7c5cf0}
@media(prefers-color-scheme:dark){:root{--bg:#18181c;--side:#111114;--panel:#202026;--text:#ececf1;--muted:#9a9eab;--line:#2d2e36;--hover:#26272e;--user:#26272e;--ink:#ececf1;--onink:#18181c}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15.5px/1.7 Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app-layout{display:flex;height:100%;position:relative;overflow:hidden}
/* sidebar */
aside{width:268px;flex:0 0 268px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:16px;letter-spacing:-.3px;padding:4px 8px 10px}
.brand-mark{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:14px;background:conic-gradient(from 200deg,var(--aura))}
.new{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;font-weight:600;border:1px solid var(--line);background:var(--panel)}
.new:hover,.foot-btn:hover{background:var(--hover)}
.side-title{font-size:12px;color:var(--muted);font-weight:600;padding:12px 10px 4px}
#roomList{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.room-item{display:flex;align-items:center;border-radius:10px;min-width:0}
.room-item:hover{background:var(--hover)}.room-item.active{background:var(--hover);font-weight:600}
.room-item .room-name{flex:1;min-width:0;text-align:left;padding:8px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.room-tools{display:flex;opacity:0;padding-right:4px}.room-item:hover .room-tools,.room-item:focus-within .room-tools{opacity:.8}
.room-tool{color:var(--muted);padding:2px 6px;border-radius:6px}.room-tool:hover{color:var(--text)}
.foot-btn{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;color:var(--muted);font-size:14px}
/* main */
main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{display:none;align-items:center;justify-content:space-between;padding:8px 10px}
.icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:18px}.icon:hover{background:var(--hover);color:var(--text)}
#chat{flex:1;overflow:auto;padding:28px 20px;display:flex;flex-direction:column;gap:26px;}
#chat>*{width:min(760px,100%);margin-inline:auto}
/* welcome + aura */
.welcome{margin:auto;text-align:center;isolation:isolate;padding:20px 0}
.aura-wrap{position:relative;display:inline-block;padding:6px 10px}
.aura-wrap::before{content:"";position:absolute;inset:-26px -70px;z-index:-1;filter:blur(34px);opacity:.55;border-radius:50%;background:radial-gradient(closest-side at 25% 50%,#4f8cff,transparent),radial-gradient(closest-side at 55% 40%,#8b5cf6,transparent),radial-gradient(closest-side at 80% 55%,#ec5fa8,transparent);animation:drift 7s ease-in-out infinite alternate}
.aura-title{margin:0;font-size:clamp(30px,5.4vw,46px);font-weight:780;letter-spacing:-1.4px;line-height:1.25;background:linear-gradient(90deg,#4f8cff,#8b5cf6,#ec5fa8,#ffb454,#4f8cff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 7s linear infinite}
.welcome p{color:var(--muted);margin:14px 0 22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:14px;background:var(--panel)}
.chip:hover{background:var(--hover);border-color:transparent;box-shadow:0 0 0 1.5px var(--accent)}
/* messages */
.msg{display:flex;gap:14px;align-items:flex-start}
.avatar{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px;background:conic-gradient(from 200deg,var(--aura))}
.msg.user{justify-content:flex-end}.msg.user .avatar{display:none}
.bubble{min-width:0;max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere;padding:2px 0}
.msg.user .bubble{max-width:78%;background:var(--user);border-radius:20px;padding:10px 16px}
.bubble p{margin:0 0 12px}.bubble p:last-child{margin:0}
.bubble h1,.bubble h2,.bubble h3{line-height:1.3;margin:20px 0 8px}
.bubble ul,.bubble ol{padding-left:24px;margin:4px 0 12px}
.bubble blockquote{border-left:3px solid var(--line);margin:10px 0;padding:2px 14px;color:var(--muted)}
.bubble code{font:.88em ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--hover);padding:2px 6px;border-radius:6px}
.bubble table{border-collapse:collapse;display:block;overflow:auto;max-width:100%;margin:10px 0}
.bubble th,.bubble td{border:1px solid var(--line);padding:7px 11px;text-align:left}.bubble th{background:var(--hover)}
.code-card{margin:12px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#14151b}
.code-toolbar{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:#1d1e26;color:#a9adbb;font-size:12px}
.code-actions{display:flex;gap:4px}.code-toolbar button{color:#c9cddb;padding:4px 9px;border-radius:7px;font-size:12px}.code-toolbar button:hover{background:#2b2d38}
.bubble pre{margin:0;padding:14px;overflow:auto;white-space:pre;color:#f1f2f6;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}
.bubble pre code{background:none;padding:0;color:inherit}
.inline-code-wrap{display:inline-flex;align-items:center;gap:3px}.inline-copy{font-size:10px;color:var(--muted);padding:0 4px;border-radius:5px}.inline-copy:hover{background:var(--hover)}
.answer-meta{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.answer-meta .copy-all-btn{padding:4px 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.answer-meta .copy-all-btn:hover{background:var(--hover);color:var(--text)}
/* composer */
.composer-wrap{padding:6px 20px 16px;width:min(800px,100%);margin:0 auto}
.composer{display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 18px;border:1.5px solid transparent;border-radius:28px;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(var(--line),var(--line)) border-box;box-shadow:0 2px 12px rgba(0,0,0,.05);transition:box-shadow .35s}
.composer:focus-within{background:linear-gradient(var(--panel),var(--panel)) padding-box,conic-gradient(from var(--a),var(--aura)) border-box;animation:spin 6s linear infinite;box-shadow:0 0 26px -4px rgba(139,92,246,.4),0 0 64px -12px rgba(79,140,255,.4)}
.composer textarea{flex:1;resize:none;min-height:40px;max-height:200px;background:none;border:0;outline:0;padding:8px 0;line-height:1.55}
.composer textarea::placeholder{color:var(--muted)}
.send{position:relative;isolation:isolate;flex:0 0 40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--onink)}
.send::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--ink);opacity:.18;z-index:-1;transition:opacity .25s}
.send::before{content:"";position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(from var(--a),var(--aura));filter:blur(7px);opacity:0;z-index:-2;transition:opacity .3s}
.send.ready::after,.send.busy::after{opacity:1}
.send.ready::before{opacity:.85;animation:spin 4s linear infinite}
.send.busy::before{opacity:1;animation:spin 1.1s linear infinite}
.send.busy{cursor:pointer}.send .ic-stop{display:none}.send.busy .ic-stop{display:block}.send.busy .ic-up{display:none}
.slow{color:var(--muted);margin:0;animation:pulse 1.6s ease-in-out infinite}.slow b{color:#e08a00;font-weight:650}
@keyframes pulse{50%{opacity:.55}}.send svg{width:18px;height:18px}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
.composer-tools{display:flex;gap:4px;align-items:center;padding-bottom:4px}
.composer-tools button,.composer-tools label{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:16px;cursor:pointer}
.composer-tools button:hover,.composer-tools label:hover{background:var(--hover);color:var(--text)}
.composer-tools input[type=file]{display:none}
.attach-bar{display:none;flex-wrap:wrap;gap:6px;padding:0 4px 8px;width:min(800px,100%);margin:0 auto}
.attach-bar.has{display:flex}
.attach-chip{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:999px;background:var(--hover);font-size:12px;max-width:220px}
.attach-chip img{width:28px;height:28px;border-radius:6px;object-fit:cover}
.attach-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attach-chip .rm{color:var(--muted);padding:0 2px;font-size:14px}.attach-chip .rm:hover{color:#e5484d}
/* settings modal */
#settings{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:16px;background:rgba(10,10,14,.5);backdrop-filter:blur(5px)}
#settings.open{display:grid}
.settings-inner{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 70px rgba(0,0,0,.3)}
.modal-head{display:flex;align-items:center;justify-content:space-between}.modal-head h2{margin:0;font-size:18px}
.field{display:flex;flex-direction:column;gap:6px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:13px;color:var(--muted)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.setting-actions{display:flex;gap:8px;flex-wrap:wrap}
.primary,.ghost{padding:10px 16px;border-radius:12px;font-weight:600}.primary{background:var(--ink);color:var(--onink)}.ghost{border:1px solid var(--line)}.ghost:hover{background:var(--hover)}
button:disabled{opacity:.45}
.status{font-size:13px;color:var(--muted)}.status.error{color:#e5484d}.notice{font-size:12px;color:var(--muted);margin:0}
/* preview */
.preview-pane{display:none;flex:0 0 min(46%,680px);min-width:320px;border-left:1px solid var(--line);background:var(--panel);flex-direction:column;min-height:0}
.preview-pane.open{display:flex}
.preview-top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.preview-title{font-weight:700;font-size:14px}.preview-controls{display:flex;gap:6px}
.preview-controls button{font-size:13px;padding:6px 11px;border-radius:9px;border:1px solid var(--line)}.preview-controls #runPreview{background:var(--ink);color:var(--onink);border-color:transparent}
.preview-editor{height:32%;min-height:110px;resize:vertical;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px;font:12px/1.5 ui-monospace,Consolas,monospace;background:var(--bg);outline:0}
.preview-frame-wrap{flex:1;min-height:0;padding:10px;background:var(--side)}
#previewFrame{width:100%;height:100%;border:1px solid var(--line);border-radius:12px;background:#fff}
#scrim{display:none}
@keyframes spin{to{--a:360deg}}
@keyframes flow{to{background-position:-250% 0}}
@keyframes drift{from{transform:translateX(-4%) scale(.96)}to{transform:translateX(4%) scale(1.06)}}
@media(max-width:900px){.preview-pane.open{position:absolute;inset:0;z-index:10;flex-basis:auto;min-width:0;border:0}}
@media(max-width:760px){
 aside{position:fixed;inset:0 auto 0 0;width:282px;z-index:25;transform:translateX(-100%);transition:transform .22s}
 aside.open{transform:none}aside.open~#scrim{display:block;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4)}
 .topbar{display:flex}.room-tools{opacity:.8}.row2{grid-template-columns:1fr}
 #chat{padding:16px 14px}.composer-wrap{padding:6px 12px 12px}.hint{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}

.loading .app-layout{visibility:hidden}
#auth{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;place-items:center;padding:20px}
.auth-card{width:min(380px,100%);text-align:center;isolation:isolate}
.auth-card p{color:var(--muted);margin:12px 0 22px}
#authTabs{display:grid;grid-template-columns:1fr 1fr;background:var(--hover);border-radius:12px;padding:4px;margin-bottom:14px}
#authTabs button{padding:8px;border-radius:9px;font-weight:600;color:var(--muted)}
#authTabs button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
#authForm{display:flex;flex-direction:column;gap:10px;text-align:left}#authForm input{padding:12px 14px}
.go-wrap{position:relative;isolation:isolate;margin-top:6px}
.go-wrap::before{content:"";position:absolute;inset:-3px;border-radius:15px;background:conic-gradient(from var(--a),var(--aura));filter:blur(9px);opacity:.75;z-index:-1;animation:spin 4s linear infinite}
#authGo{width:100%;padding:12px}
.userbox{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-top:1px solid var(--line);margin-top:4px}
.ub-main{display:flex;flex-direction:column;min-width:0;line-height:1.35}.ub-main b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ub-main span{font-size:12px;color:var(--muted)}
.ghost-sm{font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:8px}.ghost-sm:hover{background:var(--hover)}
</style>
</head>
<body class="loading">
<div class="app-layout">
<aside id="side">
  <div class="brand"><span class="brand-mark">G</span> Gims AI</div>
  <button id="createRoom" class="new">＋ 새 채팅</button>
  <div class="side-title">채팅 기록</div>
  <div id="roomList"></div>
  <div class="userbox"><div class="ub-main"><b id="userName"></b><span id="userQuota"></span></div><button id="logout" class="ghost-sm">로그아웃</button></div>
  <button id="settingsToggle" class="foot-btn">⚙ 설정</button>
</aside>
<div id="scrim"></div>
<main>
  <div class="topbar"><button id="menu" class="icon" aria-label="메뉴">☰</button><button id="newChat" class="icon" aria-label="새 채팅">＋</button></div>
  <div id="chat" aria-live="polite"></div>
  <div class="composer-wrap">
    <div class="attach-bar" id="attachBar"></div>
    <div class="composer">
      <div class="composer-tools">
        <label title="사진 업로드"><input type="file" id="photoInput" accept="image/*" multiple>🖼</label>
        <label title="파일 업로드"><input type="file" id="fileInput" accept=".txt,.md,.json,.csv,.js,.ts,.py,.html,.css,.xml,.log,.pdf">📎</label>
      </div>
      <textarea id="prompt" rows="1" placeholder="무엇이든 물어보세요" aria-label="메시지 입력"></textarea>
      <button id="send" class="send" aria-label="전송"><svg class="ic-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg><svg class="ic-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg></button>
    </div>
    <div class="hint">Enter 전송 · Shift+Enter 줄바꿈 · 사진/파일 첨부 가능</div>
  </div>
</main>
<section class="preview-pane" id="previewPane" aria-label="코드 프리뷰">
  <div class="preview-top">
    <div class="preview-title">코드 프리뷰</div>
    <div class="preview-controls"><button id="runPreview">▶ 실행</button><button id="closePreview" aria-label="프리뷰 닫기">닫기 ✕</button></div>
  </div>
  <textarea id="previewEditor" class="preview-editor" spellcheck="false" aria-label="프리뷰 코드" placeholder="HTML 코드를 여기에 입력하세요."></textarea>
  <div class="preview-frame-wrap"><iframe id="previewFrame" title="실행 결과" sandbox="allow-scripts allow-forms allow-modals"></iframe></div>
</section>
</div>
<div id="settings" role="dialog" aria-modal="true" aria-labelledby="st">
  <div class="settings-inner">
    <div class="modal-head"><h2 id="st">설정</h2><button id="closeSettings" class="icon" aria-label="닫기">✕</button></div>
    <div class="field" id="keyField"><label for="apiKey">Google Gemini API 키</label><input id="apiKey" type="text" autocomplete="off" spellcheck="false" placeholder="Gemini API 키를 입력하세요"></div>
    <div class="row2">
      <div class="field"><label for="model">모델</label><select id="model"><option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite (가장 빠름)</option><option value="gemini-3.6-flash">gemini-3.6-flash</option><option value="gemini-3.8-flash">gemini-3.8-flash</option><option value="gemini-3.1-pro-preview">gemini-3.1-pro</option></select></div>
      <div class="field"><label for="temperature">창의성</label><select id="temperature"><option value="0.3">낮음</option><option value="0.7" selected>보통</option><option value="1">높음</option></select></div>
    </div>
    <div class="setting-actions" id="keyActions"><button id="saveKey" class="primary">키 저장</button><button id="forgetKey" class="ghost">저장된 키 삭제</button></div>
    <span id="keyStatus" class="status"></span>
    <p class="notice" id="adminNote" style="display:none">API 키는 관리자만 변경할 수 있습니다. 모든 기기는 관리자가 등록한 키로 연결됩니다.</p>
    <hr style="border:0;border-top:1px solid var(--line);margin:4px 0">
    <h3 style="margin:0;font-size:15px">계정 설정</h3>
    <div class="field"><label for="accEmail">이메일</label><input id="accEmail" type="email" placeholder="example@email.com" autocomplete="email"></div>
    <div class="setting-actions">
      <button id="saveEmail" class="primary" type="button">이메일 저장</button>
      <button id="reqVerify" class="ghost" type="button">인증 코드 받기</button>
    </div>
    <div class="field" id="verifyBox" style="display:none">
      <label for="verifyCode">인증 코드 (6자리)</label>
      <div style="display:flex;gap:8px">
        <input id="verifyCode" type="text" inputmode="numeric" maxlength="6" placeholder="000000" style="flex:1">
        <button id="confirmVerify" class="primary" type="button">인증 확인</button>
      </div>
    </div>
    <span id="accStatus" class="status"></span>
    <p class="notice" id="verifyNote">이메일 인증 시 하루 질문 한도가 +30회 늘어납니다. (데모: 실제 메일 발송 없음, 코드가 화면에 표시됩니다)</p>
  </div>
</div>
<div id="auth"><div class="auth-card">
  <div class="aura-wrap"><h1 class="aura-title">Gims AI</h1></div>
  <p>로그인하면 어느 기기에서든 대화가 이어집니다.</p>
  <div id="authTabs"><button data-mode="login" class="on" type="button">로그인</button><button data-mode="register" type="button">가입</button></div>
  <form id="authForm">
    <input id="authUser" autocomplete="username" placeholder="아이디" maxlength="20" required>
    <input id="authPass" type="password" autocomplete="current-password" placeholder="비밀번호 (6자 이상)" required>
    <div class="go-wrap"><button id="authGo" class="primary">로그인</button></div>
    <div id="authErr" class="status error"></div>
  </form>
</div></div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY_STORE = 'gemini_chat_api_key_v1';
  const MODEL_STORE = 'gemini_chat_model_v1';
  let history = [];
  let busy = false; const noThink = new Set(); let abortCtl = null, stopped = false;
  let attachments = []; // { id, name, mime, data (base64), isImage, text? }
  const ROOMS_STORE = 'gims_ai_rooms_v1';
  let rooms = [];
  let currentRoomId = null;
  try { rooms = JSON.parse(localStorage.getItem(ROOMS_STORE) || '[]'); } catch (_) { rooms = []; }
  if (!Array.isArray(rooms)) rooms = [];
  if (!rooms.length) rooms = [{ id: makeId(), title: '새 대화', messages: [], updatedAt: Date.now() }];
  currentRoomId = rooms[0].id;


  let me = null, rev = 0, saveTimer = 0, rdirty = false, pollTimer = 0, authMode = 'login';
  const deletedIds = new Set();
  const storedModel = localStorage.getItem(MODEL_STORE);
  if (storedModel && [...$('model').options].some(o => o.value === storedModel)) $('model').value = storedModel;

    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => {
        const res = r.result;
        const b64 = res.split(',')[1] || '';
        resolve(b64);
      };
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }
  function readFileAsText(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result || '');
      r.onerror = reject;
      r.readAsText(file);
    });
  }
  async function addFiles(fileList, forceImage) {
    for (const file of fileList) {
      if (attachments.length >= 5) break;
      const isImage = forceImage || /^image\//.test(file.type);
      if (isImage) {
        if (file.size > 8 * 1024 * 1024) { alert(file.name + ' 이 너무 큽니다 (최대 8MB).'); continue; }
        const data = await readFileAsBase64(file);
        attachments.push({ id: Math.random().toString(36).slice(2), name: file.name, mime: file.type || 'image/jpeg', data, isImage: true });
      } else {
        if (file.size > 1 * 1024 * 1024) { alert(file.name + ' 이 너무 큽니다 (텍스트 파일 최대 1MB).'); continue; }
        const text = await readFileAsText(file);
        attachments.push({ id: Math.random().toString(36).slice(2), name: file.name, mime: file.type || 'text/plain', data: '', isImage: false, text });
      }
    }
    renderAttachments();
    $('send').classList.toggle('ready', !!$('prompt').value.trim() || attachments.length > 0);
  }
  $('photoInput').addEventListener('change', async e => {
    await addFiles(e.target.files, true);
    e.target.value = '';
  });
  $('fileInput').addEventListener('change', async e => {
    await addFiles(e.target.files, false);
    e.target.value = '';
  });
  function addMessage(role, text, id) {
    const welcome = $('welcome'); if (welcome) welcome.remove();
    const row = document.createElement('div');
    row.className = 'msg ' + (role === 'user' ? 'user' : 'assistant');
    if (id) row.id = id;
    const avatar = document.createElement('div'); avatar.className = 'avatar'; avatar.textContent = role === 'user' ? '나' : '✦';
    const bubble = document.createElement('div'); bubble.className = 'bubble'; if (role === 'assistant') bubble.innerHTML = renderMarkdown(text); else bubble.textContent = text;
    row.append(avatar, bubble); $('chat').appendChild(row); $('chat').scrollTop = $('chat').scrollHeight;
    return bubble;
  }
  async function sendMessage() {
    if (busy) return;
    const text = $('prompt').value.trim();
    if (!text && !attachments.length) return;
    const roomForRequest = currentRoom();
    if (!me?.user) return;
    const model = roomForRequest?.model || $('model').value;
    if (roomForRequest) roomForRequest.model = model;
    localStorage.setItem(MODEL_STORE, model);
    $('prompt').value = ''; $('prompt').style.height = 'auto'; $('send').classList.remove('ready');
    // 첨부 파일 설명 포함 표시용 텍스트
    let displayText = text;
    if (attachments.length) {
      const names = attachments.map(a => a.isImage ? '[사진] ' + a.name : '[파일] ' + a.name).join(', ');
      displayText = (text ? text + '\n' : '') + names;
    }
    addMessage('user', displayText);
    saveRoomMessage('user', displayText);
    // multimodal parts 구성
    const parts = [];
    let promptText = text || '';
    for (const a of attachments) {
      if (a.isImage) {
        parts.push({ inlineData: { mimeType: a.mime, data: a.data } });
      } else if (a.text) {
        promptText += (promptText ? '\n\n' : '') + '--- 파일: ' + a.name + ' ---\n' + a.text;
      }
    }
    if (promptText) parts.unshift({ text: promptText });
    if (!parts.length) parts.push({ text: '(첨부만)' });
    history.push({ role: 'user', parts });
    const sentAttachments = attachments.slice();
    attachments = [];
    renderAttachments();
    busy = true; stopped = false; abortCtl = new AbortController();
    $('send').classList.add('busy'); $('send').setAttribute('aria-label', '답장 중지');
    const answerBubble = addMessage('assistant', '');
    answerBubble.innerHTML = '<p class="slow">생각 중…</p>';
    let answer = '', raf = 0;
    const startTime = new Date();
    const slowTimer = setTimeout(() => { if (!answer) answerBubble.innerHTML = '<p class="slow">생각 중… <b>답장이 느립니다.</b> 조금 더 기다리거나 ■ 버튼으로 중지하세요.</p>'; }, 4000);
    try {
      // history에서 최근 메시지의 큰 base64는 유지하되, 서버로 보낼 때는 그대로 전달 (Gemini 지원)
      const post = nt => fetch('/api/chat', { method: 'POST', signal: abortCtl.signal, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model, contents: history.slice(-30), temperature: Number($('temperature').value), noThink: nt }) });
      const fast = /flash/.test(model) && !noThink.has(model);
      let response = await post(fast);
      if (!response.ok && fast && response.status === 400) { noThink.add(model); response = await post(false); }
      if (response.status === 401) { location.reload(); return; }
      const usedHdr = response.headers.get('X-Used');
      if (usedHdr !== null && me && !me.admin) { me.used = Number(usedHdr); renderMe(); }
      if (!response.ok) {
        let detail = `HTTP ${response.status}`;
        try { const errData = await response.json(); detail = errData?.error?.message || detail; } catch (_) {}
        throw new Error(detail);
      }
      if (!response.body) throw new Error('이 브라우저에서 스트리밍 응답을 읽을 수 없습니다. 최신 Chrome 또는 Edge를 사용하세요.');
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      const appendChunk = (chunk) => {
        const parts = chunk?.candidates?.flatMap(c => c.content?.parts || []) || [];
        const piece = parts.map(p => p.text || '').join('');
        if (piece) {
          answer += piece;
          if (!raf) raf = requestAnimationFrame(() => { raf = 0; answerBubble.innerHTML = renderMarkdown(answer); $('chat').scrollTop = $('chat').scrollHeight; });
        }
      };
      while (true) {
        const { value, done } = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
        const lines = buffer.split(/\r?\n/);
        buffer = lines.pop() || '';
        for (const line of lines) {
          if (!line.startsWith('data:')) continue;
          const payload = line.slice(5).trim();
          if (!payload || payload === '[DONE]') continue;
          try { appendChunk(JSON.parse(payload)); } catch (_) { /* Ignore partial or non-JSON SSE lines. */ }
        }
        if (done) break;
      }
      if (buffer.startsWith('data:')) {
        const payload = buffer.slice(5).trim();
        if (payload && payload !== '[DONE]') {
          try { appendChunk(JSON.parse(payload)); } catch (_) {}
        }
      }
      cancelAnimationFrame(raf); answer = answer.trim();
      if (!answer) throw new Error('응답 텍스트가 없습니다. 모델명, API 할당량 또는 안전 필터 상태를 확인하세요.');
      const endTime = new Date();
      const fmt = d => d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const durationSec = ((endTime - startTime) / 1000).toFixed(1);
      answerBubble.innerHTML = renderMarkdown(answer) +
        '<div class="answer-meta"><span>시작 ' + fmt(startTime) + ' · 종료 ' + fmt(endTime) + ' · ' + durationSec + '초</span>' +
        '<button type="button" class="copy-all-btn">답변 전체 복사</button></div>';
      answerBubble.querySelector('.copy-all-btn').addEventListener('click', async function() {
        try {
          if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(answer);
          else { const t = document.createElement('textarea'); t.value = answer; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
          this.textContent = '복사됨 ✓';
          setTimeout(() => { if (this.isConnected) this.textContent = '답변 전체 복사'; }, 1200);
        } catch (_) { this.textContent = '복사 실패'; }
      });
      saveRoomMessage('assistant', answer);
      history.push({ role: 'model', parts: [{ text: answer }] });
      $('chat').scrollTop = $('chat').scrollHeight;
    } catch (err) {
      cancelAnimationFrame(raf);
      const part = answer.trim();
      if (stopped && part) {
        const endTime = new Date();
        const fmt = d => d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const durationSec = ((endTime - startTime) / 1000).toFixed(1);
        answerBubble.innerHTML = renderMarkdown(part) +
          '<p class="slow" style="animation:none;margin-top:8px">■ 답장을 중지했습니다</p>' +
          '<div class="answer-meta"><span>시작 ' + fmt(startTime) + ' · 종료 ' + fmt(endTime) + ' · ' + durationSec + '초</span>' +
          '<button type="button" class="copy-all-btn">답변 전체 복사</button></div>';
        answerBubble.querySelector('.copy-all-btn').addEventListener('click', async function() {
          try {
            if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(part);
            else { const t = document.createElement('textarea'); t.value = part; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
            this.textContent = '복사됨 ✓';
            setTimeout(() => { if (this.isConnected) this.textContent = '답변 전체 복사'; }, 1200);
          } catch (_) { this.textContent = '복사 실패'; }
        });
        saveRoomMessage('assistant', part);
        history.push({ role: 'model', parts: [{ text: part }] });
        return;
      }
      if (stopped) {
        answerBubble.innerHTML = '<p class="slow" style="animation:none">■ 답장을 중지했습니다</p>';
        $('prompt').value = text; $('send').classList.add('ready');
      } else {
        answerBubble.textContent = '요청 실패: ' + (err.message || String(err));
        answerBubble.parentElement.querySelector('.avatar').textContent = '!';
        answerBubble.parentElement.querySelector('.avatar').style.color = '#ffaaa7';
      }
      // Remove the unanswered user turn from API history so a retry doesn't duplicate it.
      history.pop();
      const room = currentRoom();
      if (room && room.messages.length && room.messages[room.messages.length - 1].role === 'user' && room.messages[room.messages.length - 1].text === text) { room.messages.pop(); saveRooms(); renderRoomList(); }
    } finally {
      clearTimeout(slowTimer); abortCtl = null; busy = false; $('send').classList.remove('busy'); $('send').setAttribute('aria-label', '전송'); $('prompt').focus();
    }
  }
  boot();
})();
</script>
